services:
  agent-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1/}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      SHIFTZERO_AUTH_SECRET: ${SHIFTZERO_AUTH_SECRET:?set a random secret with at least 32 characters}
      SHIFTZERO_LEDGER_PATH: /app/output/agent-api.sqlite3
    volumes:
      - ./evidence/runs:/app/evidence/runs
      - ./output:/app/output
